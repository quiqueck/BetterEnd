name: Report a Bug
description: File a bug report
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a Bug in BetterEnd!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Versions

        Minecraft versions marked *legacy* still receive critical fixes only,
        versions marked *end of life* are no longer maintained.
  - type: input
    id: betterend_version
    attributes:
      label: BetterEnd
      description: What version of BetterEnd are you running?
      placeholder: 26.201.1
    validations:
      required: true
  - type: input
    id: bclib_version
    attributes:
      label: BCLib
      description: What version of BCLib are you running?
      placeholder: 26.201.1
    validations:
      required: true
  - type: input
    id: wover_version
    attributes:
      label: WorldWeaver (Wover)
      description: What version of WorldWeaver are you running?
      placeholder: 26.201.1
    validations:
      required: true
  - type: input
    id: fabric_api_version
    attributes:
      label: Fabric API
      description: What version of Fabric API is installed
      placeholder: 0.156.x
    validations:
      required: false
  - type: input
    id: fabric_loader_version
    attributes:
      label: Fabric Loader
      description: What version of Fabric Loader do you use
      placeholder: 0.19.x
    validations:
      required: false
  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft
      description: What version of Minecraft is installed?
      options:
        - "26.3 (Snapshot)"
        - "26.2"
        - "26.1.2"
        - "26.1.1"
        - "26.1"
        - "1.21.8"
        - "1.21.7"
        - "1.21.6"
        - "1.21.1 (legacy)"
        - "1.21 (legacy)"
        - "1.20.6 (legacy)"
        - "1.20.4 (legacy)"
        - "1.20.3 (legacy)"
        - "1.20.1 (legacy)"
        - "1.19.4 (end of life)"
        - "1.19.3 (end of life)"
        - "1.19.2 (end of life)"
        - "Older (end of life)"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Additional Information
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    id: other_mods
    attributes:
      label: Other Mods
      description: If you can, please supply a list of installed Mods (besides BetterEnd, BCLib and WorldWeaver). This information may already be included in the log above.
      render: shell
