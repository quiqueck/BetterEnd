plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.dblsaiko.net/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url 'https://maven.blamejared.com' }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.terraformersmc.com/releases' }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://dvs1.progwml6.com/files/maven/" }
    maven { url = "https://modmaven.dev" }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir {
        dirs 'libs'
    }
}

loom {
    accessWidenerPath = file("src/main/resources/betterend.accesswidener")
    // Ship a mixin refmap like releases up to 4.0.11 did. Loom 1.18 would otherwise
    // remap the mixin annotations in the class files only, which Sinytra Connector
    // (Forge) can not fully remap (quiqueck/BCLib#249).
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "better-end-refmap.json"
    }
    interfaceInjection {
        // When enabled injected interfaces from dependecies will be applied.
        enableDependencyInterfaceInjection = true
    }
    runs {
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.strict-validation"
            vmArg "-Dfabric-api.datagen.modid=betterend"

            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        // Add the datagenned files into the jar.
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }

    // Test-only mod. Never shipped: it is its own fabric mod (see src/testmod/resources/fabric.mod.json)
    // and is only ever put on the classpath by the `gametest` run below (and compat-test.gradle's runs),
    // so nothing here ends up in the release jar. Mirrors the 1.21.6 testmod source set.
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    runs {
        // Headless Fabric GameTest run: boots a dedicated server, executes every @GameTest in
        // src/testmod, writes a JUnit-style report.xml and exits non-zero if any test failed.
        // Usage: `./gradlew :runGametest`
        gametest {
            server()
            name "GameTest"
            runDir "build/gametest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/report.xml")}"
            source sourceSets.testmod
            ideConfigGenerated true
        }
    }

    // The testmod has to be its own mod entry or the loader would see two fabric.mod.json files on a
    // single mod path.
    mods {
        register("betterend") {
            sourceSet sourceSets.main
        }
        register("betterend-testmod") {
            sourceSet sourceSets.testmod
        }
    }
}

dependencies {
    // The testmod compiles and runs against the mod itself.
    testmodImplementation sourceSets.main.output

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    modApi "vazkii.patchouli:Patchouli:${project.patchouli_version}"
    gradle.modApiOrLocal(dependencies, ':BCLib', "com.github.quiqueck:BCLib:${project.bclib_version}", false)
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"

    //needed for trinkets, otherwise BetterEnd would require users to install trinkets
    modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"

    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    // Without a local checkout WunderLib comes along inside BCLib's jar.
    if (findProject(':wunderlib') != null) {
        implementation project(path: ':wunderlib', configuration: 'dev')
    }
}

processResources {
    println "Version: ${project.version}"
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    it.options.release = 17
}

javadoc {
    options.tags = ["reason"]
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from "LICENSE"
    from "LICENSE.ASSETS"
}

// Gradle 9 dropped the `archives` configuration - build the extra jars with assemble instead.
tasks.assemble.dependsOn(sourcesJar, javadocJar)


// Gradle 9 dropped the `archives` configuration - build the extra jars with assemble instead.
tasks.assemble.dependsOn(sourcesJar, javadocJar)

apply from: "common-helper.gradle"
apply from: "compat-test.gradle"
apply from: "common-publish-tag.gradle"
