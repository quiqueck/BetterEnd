plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group
def local_bclib = findProject(':BCLib') != null
def local_wunderlib = findProject(':wunderlib') != null
def local_wover = findProject(':WorldWeaver') != null

loom {
    accessWidenerPath = file("src/main/resources/betterend.accesswidener")
    runs {
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.strict-validation"
            vmArg "-Dfabric-api.datagen.modid=${project.modrinth_id}"

            runDir "build/datagen"
        }
    }

    if (local_wover || local_wunderlib || local_wunderlib) {
        enableTransitiveAccessWideners = true
    }
}

sourceSets {
    main {
        // Add the datagenned files into the jar.
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

subprojects { subproject ->
    subproject.tasks.withType(Javadoc) { javadocTask ->
        javadocTask.failOnError false
        javadocTask.enabled = false
    }

    subproject.tasks.withType(Jar) { jarTask ->
        if (jarTask.name == 'javadocJar') {
            jarTask.enabled = false
        }
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // https://mvnrepository.com/artifact/javax.annotation/jsr305
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'

    // run against the full jar
    modRuntimeOnly "mcp.mobius.waila:wthit:fabric-${project.wthit_version}"

    //1.19.3 modApi "vazkii.patchouli:Patchouli:${project.patchouli_version}"
    println "Using local BCLib: ${local_bclib}"
    if (local_bclib) {
        implementation project(path: ":BCLib", configuration: 'dev')
    } else {
        modImplementation "org.betterx:bclib:${project.bclib_version}"
    }
//    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
//    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"

    //needed for trinkets, otherwise BetterEnd would require users to install trinkets
    //modApi "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
//    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
//    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
//    modLocalRuntime "dev.emi:trinkets:${project.trinkets_version}"

//    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
//    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    println "Using local WunderLib: ${local_wunderlib}"
    if (local_wunderlib) {
        implementation project(path: ":wunderlib", configuration: 'dev')
    } else if (local_wover) {
        modImplementation "de.ambertation:wunderlib:${project.wunderlib_version}"
    }

    println "Using local WorldWeaver: ${local_wover}"
    if (local_wover) {
        implementation project(path: ":WorldWeaver", configuration: 'localDev')

        gradle.knownWoverModules.each {
            implementation project(path: ":WorldWeaver:$it", configuration: 'localDev')
        }
    } else if (local_bclib) {
        modImplementation "org.betterx:worldweaver:${project.wover_version}"
    }
}


repositories {
    mavenCentral()
    //mavenLocal()
    maven { url "https://maven.shedaniel.me" }
    maven { url 'https://jitpack.io' }
    maven { url "https://maven.bai.lol" }
    maven { url 'https://maven.terraformersmc.com' }
    maven { url 'https://maven.ambertation.de/releases' }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    flatDir {
        dirs 'override'
    }
}

processResources {
    // block_properties.txt is a committed property-audit snapshot (see BlockPropertiesProvider); it lives in
    // the resources source set so git tracks it, but it is not a runtime asset - keep it out of the jar.
    exclude 'block_properties.txt'
    println "Version: ${project.version}"
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    it.options.release = 21
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = "sources"
    // Same property-audit snapshot as processResources - committed, but not shipped in the sources jar.
    exclude 'block_properties.txt'
    from sourceSets.main.allSource
}

java {
    withSourcesJar()
}

jar {
    from "LICENSE"
    from "LICENSE.ASSETS"
}

// src/main/resources and src/main/generated are both in the resources source set, so a file present in
// both is packed twice. The duplicatesStrategy below keeps that from breaking the build, but it must not
// be the answer: which copy wins depends on source-dir ordering, and the copies are usually NOT the same
// file - a datagen fallback that restates a hand-authored asset is generally the worse (or broken) one.
// Duplicates are therefore a bug in the providers and get fixed there; checkDuplicateAssets makes them
// visible (and fails the build) instead of letting a silent EXCLUDE decide.
tasks.register("checkDuplicateAssets") {
    description = "Fails if src/main/generated restates a file from src/main/resources."
    group = "verification"

    def handAuthored = file("src/main/resources")
    def generated = file("src/main/generated")
    inputs.dir(handAuthored).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(generated).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { true }

    doLast {
        def relative = { root ->
            fileTree(root).files.collect { root.toPath().relativize(it.toPath()).toString() } as Set
        }
        def dupes = new TreeSet<String>(relative(handAuthored))
        dupes.retainAll(relative(generated))
        dupes.remove(".DS_Store")

        if (!dupes.isEmpty()) {
            throw new GradleException(
                    "${dupes.size()} generated asset(s) restate a hand-authored file in src/main/resources.\n" +
                            "Fix the datagen provider so it stops emitting these, rather than relying on\n" +
                            "processResources' duplicatesStrategy to pick a winner:\n" +
                            dupes.collect { "  - $it" }.join("\n")
            )
        }
    }
}
check.dependsOn("checkDuplicateAssets")

// Safety net only - src/main/generated is appended after src/main/resources, so EXCLUDE keeps the first
// (hand-authored) copy. Any duplicate that reaches this point is a bug; checkDuplicateAssets reports it.
tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    dev {
        transitive true
        canBeConsumed true
        canBeResolved true
        extendsFrom api
    }
}

artifacts {
    dev jar
}

apply from: "helper.gradle"

allprojects {
    // Allow 400 errors.
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "5000"
            //<< "-Xlint:rawtypes"
            //<< "-Xlint:unchecked"
            //<< "-Xlint:deprecation"
        }
    }
}
