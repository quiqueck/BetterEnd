// Cross-mod compatibility test task. Copy-paste this file identically into every repo/module that
// wants to opt in - BetterEnd/BetterNether at their repo root, and WorldWeaver's common.gradle for any
// wover-*-api module - the same convention common-helper.gradle documents for itself.
//
// Depends on common-helper.gradle's resolveWunderVaultDir() closure already being defined in this project, so
// apply this file AFTER common-helper.gradle wherever both are used.
//
// Participation is opt-in per module, decided purely by whether
// <vault>/modsets/<mcVersion>/<moduleName>.json exists - see the plan this implements
// (jiggly-chasing-metcalfe.md, Phase C) for the full design rationale.
//
// This file has two modes, distinguished by the -PcompatSet property:
//   - Not set (normal invocation): registers the `compatTest` task, which discovers configured mod-sets
//     and spawns the WunderVault node harness once per runnable set.
//   - Set (a child invocation the harness itself spawns): wires that one set's resolved third-party
//     jars onto a dedicated :runGametest run, isolated from the normal build/gametest/report.xml.

def compatModuleName = findProperty('mod_id') ?: project.name

def compatMcVersion = {
    def versionsJson = findProperty('modrinth_versions')
    if (versionsJson == null) return null
    def versions = new groovy.json.JsonSlurper().parseText(versionsJson)
    return versions.isEmpty() ? null : versions.last()
}()

def safeSetDirName = { String setName -> setName.replaceAll(/[^a-zA-Z0-9_.-]/, '_') }

// Resolved once, at configuration time, rather than relying on a bare "node" being found on whatever
// PATH the JavaExec that runs this ends up with. Matters in practice: a plain interactive shell (or this
// gradlew invoked directly) reliably has nvm's node on PATH, but this compatTest task can also run as a
// grandchild of another Node process (e.g. mod-task.js's own `spawnSync('./gradlew', ...)`) - whether
// PATH survives that chain intact isn't something to depend on. `which` isn't available on Windows, so
// this falls back to the bare command name there rather than failing outright.
def nodeExecutable = {
    try {
        def resolved = ["which", "node"].execute().text.trim()
        return resolved.isEmpty() ? "node" : resolved
    } catch (Exception ignored) {
        return "node"
    }
}()

// -PcompatSet/-PcompatModule are Gradle project properties, which in a multi-project build (WorldWeaver)
// are visible to every subproject at once, not just the one the harness actually targeted - without
// this equality check, applying this file to every wover-*-api submodule would make ALL of them try to
// enter child-invocation mode simultaneously for a single-module compat run, most of them lacking a
// runGametest task at all. Harmless no-op condition for single-project repos (BetterEnd/BetterNether),
// where compatModuleName always equals the -PcompatModule the harness passes.
if (project.hasProperty('compatSet') && project.hasProperty('compatModule')
        && project.property('compatModule') == compatModuleName) {
    // ---- Child-invocation mode -------------------------------------------------------------------
    def setName = project.property('compatSet')
    def vault = resolveWunderVaultDir()
    if (vault == null) {
        throw new GradleException("compat-test: -PcompatSet=${setName} was given but no WunderVault checkout was found")
    }

    def configFile = new File(vault, "modsets/${compatMcVersion}/${compatModuleName}.json")
    if (!configFile.exists()) {
        throw new GradleException("compat-test: no ${configFile}")
    }
    def config = new groovy.json.JsonSlurper().parse(configFile)
    def set = config.sets.find { it.name == setName }
    if (set == null) {
        throw new GradleException("compat-test: set '${setName}' not found in ${configFile}")
    }

    def modsDir = new File(vault, "modsets/${compatMcVersion}/mods")
    def jarFiles = (set.mods ?: []).collect { new File(modsDir, it) }
    def missing = jarFiles.findAll { !it.exists() }
    if (!missing.isEmpty()) {
        throw new GradleException("compat-test: missing jar(s) for set '${setName}': ${missing*.name}")
    }

    def dirName = safeSetDirName(setName)

    // Every attempt gets its OWN rundir, and creating one prunes the previous attempts' rundirs.
    //
    // Why a fresh dir: a Minecraft server locks <rundir>/world via DirectoryLock, and
    // CompatWorldgenBootCheck deliberately ends its run with server.halt(), which is frequently a
    // SIGTERM/143 exit. A JVM that is still on its way out therefore still holds that lock, and a run
    // started immediately afterwards on the same rundir dies at startup with
    // `session.lock: already locked (possibly by other Minecraft instance?)` before a single check runs.
    // Reproduced by running one set three times back-to-back. Sequential distinct sets do not collide
    // (each has its own dirName), so this is mainly about reruns of the SAME set and about runs started
    // while a stray JVM lingers - both of which are exactly what a developer does when investigating a
    // failure.
    //
    // Why pruning is the cleanup, and why nothing needs to reclaim a "stuck" lock: a DirectoryLock is an
    // OS advisory file lock, and the OS releases it when the holding process terminates - SIGKILL
    // included. Verified directly: process A holds it, B is refused while A lives; after A is SIGKILLed
    // the session.lock FILE is still on disk, and C acquires it anyway. So a leftover session.lock never
    // blocks anything and there is no such thing as a rundir that has to be cleaned up before it can be
    // reused. Old attempt dirs are therefore pure disk accumulation, which is why they are deleted here
    // rather than left for a separate cleanup step: at rest exactly one attempt dir per set survives -
    // the most recent one, kept deliberately so its logs and world are there to inspect after a failure.
    //
    // Only the RUNDIR moves. build/compat-test/<dirName>/{result.json,gametest/report.xml,
    // worldgen-boot-result.json} stay at their fixed paths, because the harness, the outer compatTest
    // task and mod-task.js all reconstruct those from safeSetDirName and would not find a dated one.
    def attemptId = "run-${System.currentTimeMillis()}-${ProcessHandle.current().pid()}"
    def freshRunDir = { String relParent ->
        def parent = file(relParent)
        parent.mkdirs()
        (parent.listFiles() ?: []).each { File previous ->
            if (previous.directory && previous.name.startsWith('run-')) previous.deleteDir()
        }
        file("${relParent}/${attemptId}").mkdirs()
        return "${relParent}/${attemptId}"
    }

    // Wires each third-party jar through Loom's real mod-remapping pipeline
    // (net.fabricmc.loom.configuration.mods.ModConfigurationRemapper) - the same mechanism this project
    // already relies on for fabric-api/wthit/modmenu/wover via modImplementation/modRuntimeOnly/
    // modLocalRuntime on the main source set (see the dependencies block near the bottom of build.gradle).
    // A dedicated named remap configuration is needed rather than that shorthand because the `mod*`-
    // prefixed configurations only exist for the default ('main') source set on this Loom version (see
    // build.gradle's "Loom 1.15 dropped the mod*-prefixed configurations" note) - `testmod` needs its own,
    // created explicitly via addRemapConfiguration(...).
    //
    // This replaces an earlier approach - loom.mods.register()'s modFiles plus a raw classpath(jarFile)
    // call on the run task (see git history) - that put these jars on the classpath WITHOUT ever running
    // them through Loom's remap transform. Published third-party jars are built against the `intermediary`
    // namespace (matching Fabric Loader's production remap pipeline at launch), but this dev environment's
    // runtime namespace is `named`; skipping the transform is exactly what a normal production launch's
    // Knot classloader does NOT skip, which is why the same jars boot fine outside this harness. Confirmed
    // via two reproducible failures from the raw-classpath route: `AccessWidenerFormatException: Namespace
    // (intermediary) does not match current runtime namespace (named)` at server boot (whichever mod's
    // accessWidener FabricLoaderImpl happens to read first - biomesoplenty or terrablender, order isn't
    // deterministic between runs), and - on a cold/dirty compile specifically - the mixin annotation
    // processor failing to resolve unrelated @At targets (observed against BCLib's own
    // ComposterBlockMixin, not any third-party mixin) because it was reasoning over a classpath mixing
    // still-intermediary classes with already-named ones.
    //
    // One side effect: the old worry about loom.mods.register()'s fabric.classPathGroups merging every jar
    // in a single register() block into one classpath group (so only the first jar's fabric.mod.json was
    // ever found) no longer applies here - each jar below is its own dependency, remapped and discovered
    // independently, the same way fabric-api/wthit/modmenu/wover already coexist via separate
    // modImplementation/modRuntimeOnly/modLocalRuntime declarations without collision.
    //
    // The 26.x branches deliberately do NOT share this approach, and that difference is not drift: MC 26.x
    // ships non-obfuscated, so third-party jars there declare `accessWidener v1 official` - which IS 26.x's
    // runtime namespace, leaving nothing to remap - rather than the `intermediary` the 1.21.8 jars declare,
    // and Loom's addRemapConfiguration hard-throws `UnsupportedOperationException: Cannot add remap
    // configuration in a non-obfuscated environment` from its notObfuscated() guard there. Those branches
    // therefore keep the loom.mods.register()/raw classpath(jarFile) route this comment describes replacing
    // - see the matching note in their copy of this file before syncing anything across branches.
    loom {
        addRemapConfiguration("compatTestMods") {
            sourceSet = sourceSets.testmod
            targetConfigurationName = "testmodRuntimeOnly"
            onCompileClasspath = false
            onRuntimeClasspath = true
        }
        runs {
            // A brand new run, fully self-specified, rather than reusing/extending whatever the
            // project's own pre-existing gametest run is named - that name differs between repos
            // (BetterEnd/BetterNether's testmod build.gradle names it `gametest`, giving task
            // `runGametest`; WorldWeaver's common.gradle names a submodule's `${name}-testmodGametest`,
            // giving `run${Name}-testmodGametest`). Defining `compatGametest` here sidesteps that
            // entirely - the outer-mode block below always knows the resulting task is
            // `runCompatGametest`, in every repo, unconditionally.
            compatGametest {
                server()
                source sourceSets.testmod
                runDir freshRunDir("build/compat-test/${dirName}")
                vmArg "-Dfabric-api.gametest"
                // Absolute, and deliberately NOT under the rundir: the report has to stay at the fixed
                // path the harness and mod-task.js look for it at, while the rundir moves per attempt.
                vmArg "-Dfabric-api.gametest.report-file=${file("build/compat-test/${dirName}/gametest/report.xml")}"
            }

            // A plain dedicated-server boot, deliberately NOT a GameTest run: vanilla's own
            // GameTestServer hardcodes WorldPresets.FLAT for every dimension it creates (confirmed by
            // decompiling its bytecode), so a GameTest run's overworld is unconditionally the flat/void
            // Superflat preset and can never show noise-based worldgen (TerraBlender regions,
            // Terralith's own biome source, etc) regardless of whether it actually works. This run uses
            // the project's real registered generator for every dimension instead - see
            // CompatWorldgenBootCheck's own class doc for the full mechanism (checks BiomeSource
            // contents on SERVER_STARTED, writes a result file, halts immediately either way so a bug
            // in the check can never leave the server waiting for a client that never connects).
            // Only registered when there's actually something to check - project.hasProperty is
            // available at this point since these are plain Gradle properties.
            def needsWorldgenBoot = project.hasProperty('compatExpectWorldgen') || project.hasProperty('compatExpectDefaultGenerator') || project.hasProperty('compatExpectSurfaceRule')
            if (needsWorldgenBoot) {
                def worldgenBootRunDir = freshRunDir("build/compat-test/${dirName}-worldgen-boot")
                def worldgenBootDir = file(worldgenBootRunDir)
                // A fresh rundir has no EULA acceptance and no server.properties - without both, the
                // server exits immediately (fast-fail, not a hang, but never reaches our check either).
                // Port 0 asks the OS for an ephemeral port: this server never needs a client to connect
                // (the check runs entirely from SERVER_STARTED, in-process), so binding the real
                // Minecraft port would only risk colliding with some other dev server already running
                // on the machine for no benefit.
                //
                // level-seed is PINNED on purpose. Without it the server rolls a random one, so every
                // checkout got a different world and the boot check's result became a coin flip. Measured
                // on the BOP+Terralith+Incendium+Nullscape set: 2 of 10 randomly seeded worlds failed
                // surfacerule@betterend:foggy_mushroomland on 26.1, with an identical mechanism on 26.2 -
                // a difference that read as "26.2 is broken, 26.1 is fine" for weeks.
                //
                // The other half of that fix used to be an explicit `new File(worldgenBootDir, "world")
                // .deleteDir()` here, and it is not gone, just subsumed: freshRunDir hands out an empty
                // directory every time, so there is never a previous world to inherit. That still matters
                // for exactly the two reasons it always did - a random seed is rolled ONCE at world
                // creation and then frozen in level.dat forever (which is why one machine kept
                // reproducing the same verdict and it looked deterministic), and saved chunks are loaded
                // from disk rather than regenerated, so a stale world silently keeps testing terrain
                // generated by the OLD code. If the per-attempt rundir ever goes away, the explicit
                // delete has to come back with it.
                // -PcompatWorldSeed overrides the pinned value, for reproducing a specific reported world.
                def compatWorldSeed = findProperty('compatWorldSeed') ?: 'wover-compat-test'
                new File(worldgenBootDir, "eula.txt").text = "eula=true\n"
                new File(worldgenBootDir, "server.properties").text =
                        "server-port=0\nonline-mode=false\nenable-query=false\nenable-rcon=false\n" +
                                "level-seed=${compatWorldSeed}\n"

                compatWorldgenBoot {
                    server()
                    source sourceSets.testmod
                    runDir worldgenBootRunDir
                    if (project.hasProperty('compatExpectWorldgen')) {
                        vmArg "-Dbetterx.compat.expectWorldgen=${project.property('compatExpectWorldgen')}"
                    }
                    if (project.hasProperty('compatExpectDefaultGenerator')) {
                        vmArg "-Dbetterx.compat.expectDefaultGenerator=${project.property('compatExpectDefaultGenerator')}"
                    }
                    if (project.hasProperty('compatExpectSurfaceRule')) {
                        vmArg "-Dbetterx.compat.expectSurfaceRule=${project.property('compatExpectSurfaceRule')}"
                    }
                    vmArg "-Dbetterx.compat.worldgenResultFile=${file("build/compat-test/${dirName}/worldgen-boot-result.json")}"
                }
            }
        }
    }

    // Actually add the jars as dependencies on the remap configuration set up above - this is what
    // triggers Loom's ModConfigurationRemapper to remap+cache each one and wire the remapped copy onto
    // testmod's runtime classpath (and therefore onto both run tasks below, which both `source
    // sourceSets.testmod`). No separate classpath(jarFile) call needed on the run tasks any more.
    //
    // Some of these third-party jars embed their own plain-Java library dependencies as Fabric Loader
    // "jar-in-jar" nested jars (fabric.mod.json's "jars" field, e.g. BiomesOPlenty/GlitchCore/TerraBlender
    // all embed night-config and typetools this way) instead of publishing them as normal transitive Maven
    // dependencies. Fabric Loader itself extracts and registers those at runtime *only* when it discovers
    // the parent jar via its own classpath/mod-folder scan - Loom's mod-remap pipeline used above produces
    // a remapped copy of the parent jar that still physically contains the nested jars under
    // META-INF/jars/ (confirmed by inspecting the remapped .gradle/loom-cache output directly), but its
    // fabric.mod.json loses the "jars" field in the process, so Fabric Loader never re-extracts them from
    // that copy - `NoClassDefFoundError: com/electronwill/nightconfig/core/UnmodifiableConfig` etc. at
    // TerraBlender/BiomesOPlenty entrypoint init otherwise. Rather than hardcode knowledge of which
    // third-party mod needs which library, pull every META-INF/jars/*.jar entry straight out of each
    // *original* (pre-remap) jar and add it as its own plain (non-mod - these aren't Fabric mods, no
    // remapping needed) runtime dependency, deduplicated by filename since the same library is commonly
    // embedded by more than one jar in a set.
    def nestedJarsDir = file("build/compat-test/${dirName}-nested-jars")
    def nestedJarFiles = [:]
    jarFiles.each { jarFile ->
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.startsWith("META-INF/jars/") && entry.name.endsWith(".jar")) {
                    def entryFileName = entry.name.substring("META-INF/jars/".length())
                    nestedJarFiles.computeIfAbsent(entryFileName) {
                        def outFile = new File(nestedJarsDir, entryFileName)
                        outFile.parentFile.mkdirs()
                        outFile.bytes = zip.getInputStream(entry).bytes
                        outFile
                    }
                }
            }
        }
    }

    dependencies {
        jarFiles.each { jarFile -> add("compatTestMods", files(jarFile)) }
        nestedJarFiles.values().each { nestedJarFile -> add("testmodRuntimeOnly", files(nestedJarFile)) }
    }
} else {
    // ---- Outer orchestrator mode ------------------------------------------------------------------
    tasks.register('compatTest') {
        group = 'verification'
        description = 'Boots this module together with each configured mod-set\'s third-party jars, recording pass/fail/skip for the changelog.'

        doLast {
            def vault = resolveWunderVaultDir()
            def resultsFile = file('build/compat-test/results.json')
            resultsFile.parentFile.mkdirs()

            if (vault == null) {
                logger.warn("compatTest: no WunderVault checkout found - skipping (set -PwunderVaultDir, \$WUNDER_VAULT, or check out Tools/WunderVault as a sibling of the workspace)")
                resultsFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                        [[name: 'WunderVault', status: 'SKIPPED', reason: 'WunderVault checkout not found']]
                ))
                return
            }

            // Absence of the config file is the documented OPT-OUT, and stays a silent, successful
            // no-op. It is the only "nothing ran" case that may report success - every other one below
            // means the module DID opt in and then failed to test anything, which must be loud.
            def configFile = new File(vault, "modsets/${compatMcVersion}/${compatModuleName}.json")
            if (!configFile.exists()) {
                logger.lifecycle("compatTest: no modsets/${compatMcVersion}/${compatModuleName}.json - ${compatModuleName} has not opted in, nothing to do")
                return
            }

            def harnessJs = new File(vault, 'harness/run.js')
            def config = new groovy.json.JsonSlurper().parse(configFile)
            def modsDir = new File(vault, "modsets/${compatMcVersion}/mods")
            def results = []
            // set name -> ["jar (why it is unusable)", ...], for the summary raised after results.json
            // has been written. Non-empty means this run did NOT test what it was configured to test.
            def unrunnable = [:]

            // modsets/**/mods/*.jar is git-lfs tracked (see the vault's .gitattributes), and an unfetched
            // pointer is a sub-1KB text stub that exists() happily accepts. Handing one to Fabric Loader
            // as a "mod jar" yields a run with no third-party mod actually loaded - i.e. exactly the
            // silent false-pass this gate exists to prevent, just with a file present. Mirrors the same
            // check harness/lib/config.js applies on its side (and common-helper.gradle's
            // checkVaultAssets for music tracks).
            def jarUnusableReason = { File jar ->
                if (!jar.exists()) return 'missing'
                if (jar.length() < 1024 && jar.text.take(64).startsWith('version https://git-lfs')) {
                    return 'unfetched git-lfs pointer - run `git lfs pull` in the vault'
                }
                return null
            }

            // An opted-in config that declares no sets at all can never test anything either. A module
            // opts OUT by not having this file; an empty "sets" array is a mistake, not an opt-out.
            if ((config.sets ?: []).isEmpty()) {
                resultsFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                        [[name: compatModuleName, status: 'ERROR', reason: 'config declares no mod-sets']]
                ))
                throw new GradleException(
                        "compat-test: ${configFile} declares no mod-sets, so this run tested NOTHING.\n"
                                + "A module opts out of compat-testing by not having a "
                                + "modsets/${compatMcVersion}/${compatModuleName}.json at all - an existing config with an "
                                + "empty \"sets\" array is a mistake, not an opt-out.")
            }

            config.sets.each { set ->
                def jarFiles = (set.mods ?: []).collect { new File(modsDir, it) }
                def unusable = jarFiles
                        .collect { jar -> def why = jarUnusableReason(jar); why == null ? null : "${jar.name} (${why})" }
                        .findAll { it != null }
                if (!unusable.isEmpty()) {
                    logger.error("compatTest: set '${set.name}' CANNOT RUN - unusable jar(s): ${unusable.join(', ')}")
                    results << [name: set.name, mods: set.mods, status: 'ERROR', reason: "unusable jar(s): ${unusable.join(', ')}"]
                    unrunnable[set.name] = unusable
                    return
                }

                def dirName = safeSetDirName(set.name)
                def reportFile = file("build/compat-test/${dirName}/result.json")

                logger.lifecycle("compatTest: running '${set.name}' (${(set.mods ?: []).join(', ')})")
                // gradlew only exists at the root of a build (BetterEnd/BetterNether's own repo root,
                // or WorldWeaver's root for a wover-*-api submodule) - the harness must spawn from
                // there, but the actual runGametest task and its build/compat-test/... output live
                // under THIS project (root itself for single-project repos, the submodule otherwise).
                // Project.exec(...) is gone as of this Gradle version - providers.exec(...) is the
                // replacement; .result.get() forces it to actually run (and block) right here, since we
                // need reportFile to exist before the next line.
                def projectPathPrefix = project == rootProject ? ':' : "${project.path}:"
                def gametestTaskPath = "${projectPathPrefix}runCompatGametest"
                def reportDir = file("build/compat-test/${dirName}")
                def expectWorldgen = set.expectWorldgen ?: [:]
                def expectDefaultGenerator = set.expectDefaultGenerator == true
                def expectSurfaceRule = set.expectSurfaceRule ?: [:]

                def harnessArgs = [
                        nodeExecutable, harnessJs.absolutePath,
                        'run',
                        '--workspace', rootProject.projectDir.absolutePath,
                        '--module', compatModuleName,
                        '--mc-version', compatMcVersion,
                        '--set', set.name,
                        '--report', reportFile.absolutePath,
                        '--gametest-task', gametestTaskPath,
                        '--report-dir', reportDir.absolutePath,
                ]
                if (!expectWorldgen.isEmpty() || expectDefaultGenerator || !expectSurfaceRule.isEmpty()) {
                    harnessArgs += [
                            '--worldgen-task', "${projectPathPrefix}runCompatWorldgenBoot",
                            '--worldgen-result', file("build/compat-test/${dirName}/worldgen-boot-result.json").absolutePath,
                    ]
                }

                providers.exec {
                    workingDir = rootProject.projectDir
                    commandLine(harnessArgs)
                    ignoreExitValue = true
                }.result.get()

                if (reportFile.exists()) {
                    results << new groovy.json.JsonSlurper().parse(reportFile)
                } else {
                    results << [name: set.name, mods: set.mods, status: 'FAIL', reason: 'harness produced no result.json']
                }
            }

            resultsFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(results))
            logger.lifecycle("compatTest: results written to ${resultsFile}")

            // Fail the build rather than merely logging. Before this gate, a version whose modsets/<v>/mods/
            // folder was empty skipped every single set with a logger.warn and still reported BUILD
            // SUCCESSFUL - a compat run that proved nothing while looking green, which is precisely how it
            // went unnoticed. results.json is written FIRST (above) so the changelog/validate consumers
            // still see the per-set ERROR entries even though the task now fails.
            //
            // Deliberately any-unrunnable-set, not only all-sets-unrunnable: the modset jars are committed
            // to the vault, so a declared jar that isn't on disk is always a real defect (wrong filename,
            // un-added jar, unfetched lfs), and a partially-executed run reporting green is the same false
            // pass in a smaller dose.
            if (!unrunnable.isEmpty()) {
                def message = new StringBuilder()
                message << "compat-test: ${unrunnable.size()} of ${config.sets.size()} configured mod-set(s) could not run for "
                message << "${compatModuleName} / Minecraft ${compatMcVersion} - their third-party jars are not usable, "
                message << "so those sets tested NOTHING.\n\n"
                message << "  jars are looked for in : ${modsDir.absolutePath}\n"
                message << "  and declared by        : ${configFile.absolutePath}\n\n"
                unrunnable.each { setName, jars ->
                    message << "  set '${setName}':\n"
                    jars.each { message << "    - ${it}\n" }
                }
                message << "\nFix by placing the jar(s) above in ${modsDir.absolutePath}, or by removing/adjusting the\n"
                message << "affected set(s) in ${configFile.name}. A build actually compatible with Minecraft ${compatMcVersion}\n"
                message << "must exist upstream - do NOT substitute a build for a different Minecraft version to make this pass."
                throw new GradleException(message.toString())
            }

            // Fail the build on a set that RAN and did not pass, not only on one that could not run at all
            // (the gate above). The two are genuinely different defects - ERROR means this run proved
            // NOTHING, FAIL/TIMEOUT means it proved something IS broken - but both are a reason for
            // `./gradlew :compatTest` to be red rather than BUILD SUCCESSFUL. Until this gate existed only
            // the ERROR half was enforced here, so a real cross-mod regression exited 0 and was visible
            // only to a consumer that went and read results.json for itself afterwards (mod-task.js's
            // `validate` does exactly that and has always failed on FAIL/TIMEOUT - this closes the same
            // hole for anyone invoking the gradle task directly).
            //
            // Deliberately ordered AFTER the unrunnable gate: when both apply, "your jars are missing" is
            // the more actionable message, and a set that never ran has no check results to report here.
            //
            // This can never fire for a module that has not opted in: that case returns further up, before
            // any set runs, and remains a silent successful no-op. A SKIPPED entry (no WunderVault
            // checkout) returns even earlier and likewise stays green - a vault that simply isn't on this
            // machine is not a compat failure.
            def failedSets = results.findAll { it.status == 'FAIL' || it.status == 'TIMEOUT' }
            if (!failedSets.isEmpty()) {
                def message = new StringBuilder()
                message << "compat-test: ${failedSets.size()} of ${config.sets.size()} configured mod-set(s) FAILED for "
                message << "${compatModuleName} / Minecraft ${compatMcVersion}.\n\n"
                failedSets.each { result ->
                    message << "  set '${result.name}' - ${result.status}\n"
                    // `false`, not falsy: the harness reports checks.worldgen as null (not false) for a set
                    // that has no worldgen expectations configured at all, and a check that was never asked
                    // for is not a check that failed.
                    def failedChecks = (result.checks ?: [:]).findAll { it.value == false }.keySet()
                    if (!failedChecks.isEmpty()) {
                        message << "    failed check(s): ${failedChecks.join(', ')}\n"
                    }
                    (result.failures ?: []).each { message << "    - ${it}\n" }
                    if (result.reason) {
                        message << "    reason: ${result.reason}\n"
                    }
                }
                message << "\nEvery check that ran, passing ones included, is recorded in ${resultsFile.absolutePath}.\n"
                message << "Each set's own run directory - server log, gametest report, worldgen boot result - is under\n"
                message << "${file('build/compat-test').absolutePath}."
                throw new GradleException(message.toString())
            }
        }
    }
}
