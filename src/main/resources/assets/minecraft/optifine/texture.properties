# Declares the PBR encoding used by this mod's "_s" specular textures, so
# Iris/OptiFine shaders read the channels correctly instead of guessing.
#
#   R  perceptual smoothness   roughness = (1 - R/255)^2
#   G  0-229 linear F0 | 230-237 predefined metal | 255 albedo-as-F0
#   B  0-64 porosity | 65-255 subsurface scattering
#   A  0-254 emission (0-100%), 255 = not emissive
#
# Defines MC_TEXTURE_FORMAT_LAB_PBR and MC_TEXTURE_FORMAT_LAB_PBR_1_3.
# Spec: https://shaderlabs.org/wiki/LabPBR_Material_Standard
#
# Emissive blocks additionally ship the "_e" overlays declared in
# emissive.properties, for Continuity users playing without a shader.
format = lab-pbr/1.3
